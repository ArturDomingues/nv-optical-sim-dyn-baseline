# Physical constants for the NV-center models.
# These values are AUTHORITATIVE (previously hard-coded in models.py).
# Units are noted per section. Loaded by core/constants.py.

[hilbert]
dim = 7                       # NV electronic Hilbert-space dimension (7-level system)

[strain]                      # MHz
ground = 0.0                  # E_GS  (a typical nonzero value is ~7.5)
excited = 70.0                # E_ES

[zero_field_splitting]        # MHz
ground = 2870.0               # D_GS
excited = 1420.0              # D_ES

# Hyperfine interaction parameters (MHz)
[hyperfine.isotropic]         # models 1 & 3
a_ground = [3.03, 3.65]       # A_GS = (parallel, perpendicular)
a_excited = [-57.8, -39.2]    # A_ES

[hyperfine.anisotropic]       # model 2
a_parallel = [3.4, -58.1]     # A_PAR
a_perp = [7.8, -77.0]         # A_PERP
a_aniso = [0.0, 0.0]          # A_ANI
a_perp_prime = [0.0, 0.0]     # A_PERP_PRIME
phi_h = 0.0                   # PHI_H (rad)

[magnetic_moment]             # MHz/G
electron = 2.8                # MU_E
nitrogen15 = 4.317e-4         # MU_N  (= 431.7e-6)

[t1]                          # spin-lattice relaxation times (microseconds)
ground = 1.0e3                # T1_GS
excited = 1.0e3               # T1_ES
nitrogen15 = 1.0e5            # T1_N

[t2]                          # coherence times (microseconds)
ground = 1.5                  # T2_GS
excited = 6.0e-3              # T2_ES
nitrogen15 = 1.0e3            # T2_N

[drive]                       # MHz
pump_rate = 1.9               # W_P   (laser pump rate)
rabi = 15.7                   # OM_R  (tuned to reproduce the reference; original 15)
mw_drive = 0.1                # OMEGA_MG

[rates]
# Transition-rate sets (MHz). Each row, indexed by K_S[k][·]:
#   [0] k41,k52,k63  radiative (excited -> ground)
#   [1] k47          non-radiative (excited -> ISC)
#   [2] k57,k67      non-radiative (excited -> ISC)
#   [3] k71          non-radiative (ISC -> ground)
#   [4] k72,k73      non-radiative (ISC -> ground)
selected_index = 2            # K_IND
sets = [
  [66.0, 0.0,   57.0, 1.0,  0.7  ],
  [77.0, 0.0,   30.0, 3.3,  0.0  ],
  [62.7, 12.97, 80.0, 3.45, 1.08 ],
  [63.2, 10.8,  60.7, 0.8,  0.4  ],
  [67.4, 9.9,   96.6, 4.83, 1.055],
  [64.0, 11.8,  79.8, 5.6,  0.0  ],
]

[magnetic_field]              # default static field
magnitude = 100.0             # Gauss
phi = 0.0                     # rad
theta = 0.0                   # rad
